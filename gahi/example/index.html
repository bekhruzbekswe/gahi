<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--paper:#EDF0F3;--sheet:#FBFCFD;--ink:#15202B;--muted:#566471;--rule:#D1D8DE;--human:#0B5FD6;--human-soft:rgba(11,95,214,.12);--agent:#C2500A;--ok:#137A4E;--stop:#B3123E;--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--gahi-bg:var(--sheet);--gahi-fg:var(--ink);--gahi-rule:var(--rule);--gahi-human:var(--human);--gahi-agent:var(--agent);--gahi-before:var(--stop);--gahi-after:var(--ok);--gahi-font:var(--body);--gahi-mono:var(--mono)}
@media (prefers-color-scheme:dark){:root{--paper:#0F141A;--sheet:#171E26;--ink:#E6ECF2;--muted:#9AA8B5;--rule:#2B3540;--human:#7AA9FF;--human-soft:rgba(122,169,255,.16);--agent:#FF9A52;--ok:#4FD39A;--stop:#FF6B8A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--body)}
#app{height:100%;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--rule);border-radius:7px;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--human);outline-offset:1px}
.list{background:var(--sheet);border-right:1px solid var(--rule);overflow:auto;min-width:0}
.list h1{font:700 22px var(--display);margin:0;padding:14px 16px 8px}
.list ul{list-style:none;margin:0;padding:0}
.row{position:relative;border-bottom:1px solid var(--rule)}
.row.open{background:var(--human-soft)}
.pick{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-radius:0;padding:9px 38px 9px 14px;text-align:left}
.face{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--human-soft);font-weight:600}
.who{display:grid;min-width:0}
.who small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{min-width:20px;padding:0 6px;border-radius:10px;background:var(--human);color:var(--sheet);font-size:12px;font-weight:600;text-align:center}
.pin{position:absolute;right:7px;top:7px;width:26px;height:26px;padding:0;border:0;font-size:13px;opacity:0;filter:grayscale(1)}
.row:hover .pin,.pin:focus-visible{opacity:.65}
.pin.on{opacity:1;filter:none}
.pane{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
.pane.empty{display:grid;grid-template-rows:1fr;place-items:center;color:var(--muted)}
.pane header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:11px 16px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.pane header strong{font:700 17px var(--display)}
.tools{display:flex;gap:6px}
.tools button{padding:4px 10px;font-size:13px}
.messages{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:min(460px,85%);align-self:flex-start;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:7px 11px;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:var(--human-soft);border-color:transparent}
.bubble p{margin:0}
form{display:flex;gap:8px;padding:10px 16px 56px;background:var(--sheet);border-top:1px solid var(--rule)}
textarea{flex:1;min-width:0;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:7px 10px;resize:none}
form button{padding:0 16px;background:var(--human);border-color:var(--human);color:var(--sheet);font-weight:600}
@media (max-width:640px){#app{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr)}.list{border-right:0;border-bottom:1px solid var(--rule)}}
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="/main.js"></script>
</body>
</html>
